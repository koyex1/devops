server:
  http_listen_port: 9080 

positions:
  filename: /tmp/positions.yaml 

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  #first job name
  - job_name: docker # this promtail is for collecting logs from docker containers not my app logs,
    static_configs:
      - targets:
          - localhost
        labels: 
          job: docker
          __path__: /var/lib/docker/containers/*/*.log 
  #second job name
