services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: devops-portainer
    restart: unless-stopped
    ports: #default login is admin and then you will be prompted to change it to your own password when you first access the UI at http://localhost:9443. The port 8100 is for Portainer Agent, which is optional and only needed if you want to manage remote Docker hosts or use the agent-based monitoring features. The port 9004 is for the HTTP Web UI, which is disabled by default for security hardening, but you can enable it if you want to access the UI over HTTP instead of HTTPS. Just make sure to update the URL accordingly when you access the UI.
      - "8100:8000"   # port for Portainer Agent (optional, only needed if you want to manage remote Docker hosts or use the agent-based monitoring features)
      - "9444:9443"   # HTTPS Web UI
      - "9004:9000"   # Optional: HTTP WEB UI (disabled by default) 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Manage Docker host
      - portainer_data:/data  # Persist configuration
    command: -H unix:///var/run/docker.sock

  postgres:
    image: postgres:16
    container_name: devops-postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    command: > #command below is to enable pg_stat_statements used by adminer and pmm for query performance monitoring. You can also enable other extensions here if you want, just make sure to install them in the postgres image first by creating a custom Dockerfile that extends the official postgres image and installs the extensions you need.
      postgres
      -c shared_preload_libraries=pg_stat_statements 
      -c pg_stat_statements.track=all
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      
  adminer:
    image: adminer:latest
    container_name: devops-adminer
    ports:
      - "8082:8080"

  redis:
    image: redis:7
    container_name: devops-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"] # this command enables data persistence by writing every change to disk, so that your data won't be lost when the container restarts. You can also add other redis configuration options here if you want, just make sure to use the correct syntax for the command.
    volumes:
      - redis_data:/data

  redis-ui:
    image: redis/redisinsight:latest
    container_name: devops-redis-ui
    ports:
      - "5540:5540"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: devops-rabbitmq
    ports:
      - "5672:5672" 
      - "15672:15672" #port for management UI, you can access it at http://localhost:15672 with default username and password both being "guest". This UI allows you to monitor your queues, exchanges, bindings, and also publish messages for testing.
      - "15692:15692" #port for prometheus metrics, you can access it at http://localhost:15692/metrics to see the raw metrics output. You can also add this endpoint to your Prometheus config to scrape metrics from RabbitMQ.
    env_file:
      - ./secrets/rabbitmq.env
    command: >
      bash -c "
      rabbitmq-plugins enable rabbitmq_prometheus &&
      rabbitmq-server
      "

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: devops-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "mntr,ruok,stat"
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=mntr,ruok,stat"
    ports:
      - "2181:2181"
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: devops-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092" #port for external clients like your backend and kafka-ui to connect
      - "29092:29092" #port for internal communication between kafka and other services
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"

      # internal docker network listener:
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: devops-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  backend: #for the backned we set it up for logs, metrics, tracing and debugging, so we can have a full observability and monitoring setup for our backend service. You can customize the environment variables and ports as needed for your specific use case.
    build:
      context: ./backend
    container_name: devops-backend
    env_file:
      - ./backend/.env
    environment:
      - NODE_OPTIONS=--require ./src/tracing.js # Auto-start tracing --inspect this if for node inspect(v8-built in not an external file)
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4318 # OTLP HTTP endpoint for REST
       # For gRPC, your instrumentation should be configured to use the gRPC endpoint (4317)
      - OTEL_SERVICE_NAME=backend-service
      - ELASTIC_APM_SERVICE_NAME=backend-service 
      - ELASTIC_APM_SERVER_URL=http://apm-server:8200
    ports:
      - "4000:4000"  # REST + GraphQL + Socket.IO
      - "50051:50051" # gRPC server 
      - "9229:9229" # Node.js inspector for debugging this   is for --inspect=0.0.0.0:9229
    networks:
      - default
      - signoz-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started

#this is a proxy server between your browser and your node js backend(which serves both REST and gRPC) to handle gRPC-Web requests from the frontend and forward them to the backend. It also allows you to expose your gRPC services to the browser, which doesn't natively support gRPC.
  envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: devops-envoy
    volumes:
      - ./infra/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8180:8180" # grpc-web to backend gRPC
      - "9901:9901" #admin metrics port
    depends_on:
      - backend

  nextjs:
    build:
      context: ./frontends/nextjs
    container_name: devops-nextjs
    env_file:
      - ./frontends/nextjs/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - envoy

  vite:
    build:
      context: ./frontends/vite-react
    container_name: devops-vite
    env_file:
      - ./frontends/vite-react/.env
    ports:
      - "5173:80"
    depends_on:
      - backend
      - envoy

  etcd: #etcd here is used for apisix which is the api gateway.
    image: quay.io/coreos/etcd:v3.5.0
    container_name: devops-etcd
    restart: always
    environment:
      - ETCD_DATA_DIR=/etcd_data
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd_data

#this is also a proxy server but it is for API Gateway to route REST API calls from the frontend to the backend and also to provide a single entry point for all your APIs, which can be useful for things like authentication, rate limiting, and monitoring. It also allows you to expose your REST APIs to the browser without worrying about CORS issues.
  apisix:
    image: apache/apisix:latest
    container_name: devops-apisix
    restart: always
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - etcd
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "9080:9080" # HTTP Traffic
      - "9180:9180" # Admin API (Dashboard talks to this)
      - "9443:9443" # HTTPS Traffic
      - "9091:9091" # Metrics Export

  apisix-dashboard:
    image: apache/apisix-dashboard:latest
    container_name: devops-apisix-dashboard
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - ./apisix_conf/dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    depends_on:
      - etcd
  # --- ELASTICSEARCH (Storage) ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: devops-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true # Set to true for production
      - ELASTIC_PASSWORD=changeme # for user=elastic, while kibana_system user has its own password defined in kibana service
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200" # HTTP API
      - "9300:9300" # Internal Transport
    deploy:
      resources:
        limits:
          memory: 1g

  # --- KIBANA (Visualization Dashboard) ---
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: devops-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system #kibana_system different from elastic user, which is the superuser. This is for security hardening, so that if kibana is compromised, the attacker won't have full access to elasticsearch. 
      - ELASTICSEARCH_PASSWORD=l4GiwD8q9OHASKUAA958 #docker exec -it devops-elasticsearch \ elasticsearch-reset-password -u kibana_system
      - xpack.security.enabled=true 
      - xpack.encryptedSavedObjects.encryptionKey=0123456789abcdef0123456789abcdef
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # --- APM SERVER (Intake) ---
  apm-server: 
    image: docker.elastic.co/apm/apm-server:8.13.4
    container_name: devops-apm-server
    ports:
      - "8200:8200"
    command: >
      apm-server -e
      -E output.elasticsearch.hosts=["elasticsearch:9200"]
      -E output.elasticsearch.username=elastic
      -E output.elasticsearch.password=changeme
      -E apm-server.host="0.0.0.0:8200"
      -E setup.kibana.host="kibana:5601"
      
    depends_on:
      - elasticsearch
      - kibana 

  # --- PERCONA PMM SERVER (database Monitoring) ---
  pmm-server: #pmm full meaning is Percona Monitoring and Management.
    image: percona/pmm-server:2
    container_name: devops-pmm-server
    restart: always
    ports:
      - "8085:80" #port here connects to client, which is your browser to access PMM dashboard, you can change it if you want but make sure to update the URL accordingly when you access the dashboard. The default username and password for PMM are both "admin". You can log in to the PMM dashboard at http://localhost:8085 and start monitoring your databases.
      - "8443:443" #port here connects to PMM clients, which are the PMM agents running on your database containers. This is the port that PMM agents use to send metrics data to the PMM server. Make sure this port is open and accessible from your database containers so that they can communicate with the PMM server.
    volumes:
      - pmm_data:/srv
  
  pmm-client:
    image: percona/pmm-client:2
    container_name: devops-pmm-client
    depends_on:
      - pmm-server
      - postgres
    environment:
      PMM_AGENT_SERVER_ADDRESS: pmm-server:443
      PMM_AGENT_SERVER_USERNAME: admin
      PMM_AGENT_SERVER_PASSWORD: admin
    command: >
      bash -c "
      pmm-agent setup
        --server-address=pmm-server:443
        --server-username=admin
        --server-password=admin
        --force &&
      pmm-admin add postgresql
        --username=appuser
        --password=apppass
        --host=postgres
        --port=5432
        --query-source=pgstatmonitor
      "

  # clickhouse:
  #   image: clickhouse/clickhouse-server:24.8
  #   ports:
  #     - "8123:8123" # HTTP API
  #     - "9100:9100" # Native TCP
  #   volumes:
  #     - ./clickhouse-ports.xml:/etc/clickhouse-server/config.d/ports.xml
  #     - clickhouse_data:/var/lib/clickhouse
  #
  # --- SIGNOZ STACK ---
  # signoz-query-service:
  #   image: signoz/query-service:latest
  #   ports:
  #     - "8280:8280" # Internal API port
  #   environment:
  #     - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
  #     - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9100
  #
  #   volumes:
  #     - signoz_sqlite:/var/lib/signoz
  #   depends_on:
  #     - clickhouse
  #
  # signoz-frontend:
  #   image: signoz/frontend:latest
  #   container_name: devops-signoz-frontend
  #   ports:
  #     - "3301:3301" # <--- HERE IS YOUR UI PORT
  #   environment:
  #     - BACKEND_API_IP=signoz-query-service
  #     - FRONTEND_API_PORT=8280
  #     - BACKEND_API_URL=http://signoz-query-service:8280  # Try this variable name
