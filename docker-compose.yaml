  #     - REACT_APP_API_URL=http://signoz-query-service:8280
  #   depends_on:
  #     - signoz-query-service
  #
  # signoz-otel:
  #   image: signoz/signoz-otel-collector:latest
  #   container_name: devops-signoz-otel
  #   command: ["--config=/etc/otel-collector-config.yaml"]
  #   ports:
  #     - "4317:4317" # OTLP gRPC
  #     - "4318:4318" # OTLP HTTP
  #   volumes:
  #     - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
  #   depends_on:
  #     - clickhouse
  #     - signoz-query-service

  #metrics - agents for promethseu
  node-exporter: #this for the node.
    image: prom/node-exporter:latest
    container_name: devops-node-exporter
    ports:
      - "9101:9100"
  cadvisor: #cadvisor is container advisor, for the containers. All the containers in this docker-compose file will be monitored by cadvisor, which provides resource usage and performance characteristics of running containers. It collects, aggregates, processes, and exports information about running containers. This includes information about the container's CPU usage, memory usage, network I/O, and filesystem I/O. You can access the cadvisor UI at http://localhost:8086 to see the metrics for all your containers, or you can add it as a target in your Prometheus config to scrape the metrics and visualize them in Grafana.
  #it metrics shown are for all containers, not just the backend container, so you can monitor the resource usage of your entire application stack. This is especially useful for identifying performance bottlenecks and optimizing resource allocation across your services.
    image: gcr.io/cadvisor/cadvisor:latest 
    container_name: devops-cadvisor
    ports:
      - "8086:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: devops-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://appuser:apppass@postgres:5432/appdb?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
  redis-exporter:
    image: oliver006/redis_exporter
    container_name: devops-redis-exporter
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
  kafka-exporter:
    image: danielqsj/kafka-exporter
    container_name: devops-kafka-exporter
    command:
      - --kafka.server=kafka:29092
    ports:
      - "9308:9308"
    depends_on:
      - kafka
  elasticsearch-exporter:
    image: justwatch/elasticsearch_exporter
    container_name: devops-elasticsearch-exporter
    environment:
      ES_URI: http://elasticsearch:9200
    ports:
      - "9114:9114"
  zookeeper-exporter:
    image: wintechnano/zookeeper_exporter:latest
    container_name: devops-zookeeper-exporter
    ports:
      - "9143:9143"
    environment:
      - ZOOKEEPER_HOSTS=zookeeper:2181
      
  #zookeeper-exporter:
  #  image: dabealu/zookeeper-exporter
  #  container_name: devops-zookeeper-exporter
  #  command:
  #    - "--zk-hosts=zookeeper:2181"  # ← Use this format
  #  ports:
  #    - "9141:9141"
  #  depends_on:
  #    - zookeeper
  

  #otel and jaeger
  otel-collector:
    container_name: devops-otel-collector
    image: otel/opentelemetry-collector-contrib:0.96.0
    volumes:
      - ./otel-config.yaml:/etc/otel/config.yaml
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics endpoint

  jaeger:
    container_name: devops-jaeger
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true 
      - COLLECTOR_OTLP_HTTP_ENABLED=true
    ports:
      - "16686:16686"   # UI
      - "14250:14250"   # collector gRPC
      - "14268:14268"   # collector HTTP

  #grafana and prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: devops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
  
  grafana:
    image: grafana/grafana:latest
    container_name: devops-grafana
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
  vault:
    image: hashicorp/vault:latest
    container_name: devops-vault
    restart: unless-stopped
    ports:
      - "18200:8200"  # Host 18200 → Container 8200
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: myroot
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - vault_data:/vault/data
  vault-agent:
    image: hashicorp/vault:latest
    container_name: devops-vault-agent
    user: root
    cap_add:
    - IPC_LOCK
    volumes:
      - ./vault-agent.hcl:/etc/vault/agent.hcl
      - ./templates:/templates
      - ./secrets:/secrets
      - ./token/token:/vault/token
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: myroot
    command: vault agent -config=/etc/vault/agent.hcl
    depends_on:
      - vault

#logs setup
  loki:
      image: grafana/loki:2.9.6
      container_name: devops-loki
      ports:
        - "3100:3100"
      command: -config.file=/etc/loki/local-config.yaml
      volumes:
        - ./loki-config.yaml:/etc/loki/local-config.yaml
         - loki-data:/loki
  promtail:
    image: grafana/promtail:2.9.6
    container_name: devops-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml

  #elk - logstash and filebeat
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: devops-logstash
    #docker exec -it devops-elasticsearch \ elasticsearch-reset-password -u kibana_system
    ports:
      - "5044:5044"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
      - kibana
      
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: devops-filebeat
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml
    
  #ci/cd
  # --- PostgreSQL for SonarQube ---
  sonarqube-db:
    image: postgres:15
    container_name: devops-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonarpass
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  # --- SonarQube ---
  sonarqube:
    image: sonarqube:9.9-community
    container_name: devops-sonarqube
    depends_on:
      - sonarqube-db
      - elasticsearch
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonarpass
    ports:
      - "9400:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped

  # --- Jenkins ---
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: devops-jenkins
    user: root
    environment:
      JAVA_OPTS: -Dhudson.model.DirectoryBrowserSupport.CSP=
    ports:
      - "8480:8080" # Jenkins Web UI
      - "50000:50000" # Jenkins agent communication
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  signoz-net:
    external: true

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  clickhouse_data:
  signoz_sqlite:
  pmm_data:
  grafana_data:
  vault_data:
  portainer_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  jenkins_home: